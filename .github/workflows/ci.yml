name: AgenticTeam validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the installer bug that shipped in v2 only
        # reproduced there, because `python3` resolves to the Microsoft Store stub.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate source
        run: python scripts/agentic_team.py validate

      - name: Run runtime and adapter tests
        run: python -m unittest discover -s tests -v

      - name: Check shell wrapper syntax
        shell: bash
        run: bash -n scripts/install.sh

      # A syntax check never caught the interpreter bug. Actually install, on both OSes.
      - name: Install every harness via install.sh
        shell: bash
        run: |
          set -euo pipefail
          for harness in claude-code codex opencode antigravity gemini-cli pi generic; do
            target="$(mktemp -d)/proj"
            bash scripts/install.sh --target "$target" --harness "$harness" --preset platform-core
            test -d "$target/.agentic-team" || { echo "no bus for $harness" >&2; exit 1; }
          done

      - name: Install via install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ps-install'
          ./scripts/install.ps1 -Target $target -Harness codex -Preset platform-core
          if (-not (Test-Path (Join-Path $target '.agentic-team'))) { throw 'install.ps1 produced no bus' }

      - name: Preflight skills report
        run: python scripts/preflight_skills.py

  # Optional full-mode OCR review of this repository's own changes.
  # Opt in by setting repository variable ENABLE_OCR_REVIEW=true and the OCR_*
  # secrets for a configured provider (ocr config provider/model). Agents never
  # hold these credentials; this job is the only sanctioned full-mode surface.
  ocr-review:
    needs: test
    if: vars.ENABLE_OCR_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ocr CLI
        run: npm install -g @alibaba-group/open-code-review
      - name: Run OCR review
        env:
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          OCR_BASE_URL: ${{ secrets.OCR_BASE_URL }}
          OCR_MODEL: ${{ secrets.OCR_MODEL }}
        run: ocr review --from "${{ github.event.pull_request.base.sha || github.event.before }}" --to HEAD
